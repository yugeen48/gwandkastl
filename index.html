<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="themecolor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gwandkastl">
<title>Gwandkastl</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5F2; --ink:#000000; --soft:#EBEAE6; --muted:#6F6F6F; --line:#DEDDD8;
  --stage:#C9C9C4;   /* immer gleiches mittleres Grau hinter den Kleidungsstücken */
  --loden:#3F4B3A; --onaccent:#FFFFFF; --danger:#B3261E;
  --font:'Jost', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#141414; --ink:#F2F2EF; --soft:#232321; --muted:#A3A39E; --line:#34342F;
  --loden:#9CB08F; --onaccent:#10140E; --danger:#FF8A80; color-scheme:dark;
}
body{transition:background-color .6s, color .6s}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);font-weight:400;font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--loden);outline-offset:2px}
img{display:block;max-width:100%}
h1{font-weight:300;font-size:clamp(28px,6vw,40px);line-height:1.1;letter-spacing:-.01em}
h2{font-weight:400;font-size:20px}
.muted{color:var(--muted)} .small{font-size:14px}

/* Kopf & Navigation */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 94%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 12px;display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line)}
.logo{font-weight:300;font-size:29px;letter-spacing:.01em}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;text-align:left;min-width:0}
.owner{color:var(--muted);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:2px}
.owner svg{width:16px;height:16px;align-self:center}
.bgbar{position:absolute;left:0;right:0;bottom:-1px;transform:translateY(100%);background:var(--bg);border-bottom:1px solid var(--line);padding:6px 20px 8px;font-size:13px}
.bgbar[hidden]{display:none}
.bgline{display:flex;align-items:center;gap:8px}
.bgcancel{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;background:#D33;color:#fff;display:grid;place-items:center}
.bgcancel svg{width:13px;height:13px}
.bgbar .charly{width:22px;height:30px}
.bgbar:not(.withcharly) .charly{display:none}
.charly{width:30px;height:40px;flex:none;overflow:visible}
.charly .eyes{animation:ch-look 2.6s ease-in-out infinite}
.charly .lid{animation:ch-blink 3.4s infinite}
.charly .ant{animation:ch-ant 1s steps(2) infinite}
@keyframes ch-look{0%,100%{transform:translateX(0)}20%{transform:translateX(-16px)}55%{transform:translateX(16px)}75%{transform:translateX(0)}}
@keyframes ch-blink{0%,90%,100%{opacity:0}93%,95%{opacity:1}}
@keyframes ch-ant{50%{opacity:.2}}
.rcard .ph .charly{width:56px;height:76px}
.desc.loading{display:flex;align-items:center;gap:12px}
.desc .who{display:block;font-size:13px;font-weight:500;margin-bottom:2px}
.bgbar .track{height:2px;background:var(--line);margin-top:5px;overflow:hidden;position:relative}
.bgbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--loden);transition:width .4s}
.bgbar .fill.indet{width:30%!important;animation:indet 1.4s ease-in-out infinite}
@keyframes indet{from{left:-30%}to{left:100%}}
.pend{font-size:12px;color:var(--muted);margin-top:1px}
.bgbar.err #bgtext{color:var(--danger)}
.menu{display:flex;flex-direction:column;margin-top:22px;border-top:1px solid var(--line)}
.mitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);text-decoration:none;font-size:16px}
.mtoggle{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);font-size:16px}
.mtoggle .mtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.mswitch{flex:none;width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:background-color .2s}
.mswitch::after{content:'';position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.mswitch.on{background:#34C759}
.mswitch.on::after{transform:translateX(19px)}
.inline{display:flex;gap:8px}
.inline .btn{flex:none}
.nav{display:flex;gap:28px;align-items:center}
.navadd{width:34px;height:34px;border:1.5px solid var(--line);margin-left:2px}
.navadd svg{width:17px;height:17px}
.navadd.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.nav button{font-size:15px;padding:6px 0;border-bottom:1.5px solid transparent;color:var(--muted)}
.nav button.on{color:var(--ink);border-color:var(--ink)}
.icbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.icbtn:hover{background:var(--soft)}
svg{width:22px;height:22px;flex:none}
main{max-width:1100px;margin:0 auto;padding:22px 20px calc(110px + env(safe-area-inset-bottom,0px))}
.tabbar{display:none}
@media (max-width:799px){
  .top .nav{display:none}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:4px}
  .tabbar button.on{color:var(--ink)}
}

/* Allgemeine Bausteine */
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.count{color:var(--muted);font-size:15px}
.head .push{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:2px;font-weight:500;font-size:15px;border:1px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn svg{width:18px;height:18px}
.linkbtn{font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;background:var(--bg)}
.chip.on{background:var(--loden);border-color:var(--loden);color:var(--onaccent)}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid rgba(0,0,0,.18)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.dot2{display:inline-block;width:9px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,.18);flex:none;margin-left:-3px}
.field{margin-top:18px}
.field h3{font-size:14px;font-weight:500;margin-bottom:8px}
.field h3 span{font-weight:400}
select,input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid var(--line);border-radius:2px;padding:11px 12px;background:var(--bg);color:var(--ink);font-size:16px}
textarea{font:inherit}
.spinner{width:28px;height:28px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:14px;background:var(--soft);padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.note img{width:44px;height:55px;object-fit:contain;background:var(--stage)}
.empty{max-width:520px;padding:10vh 0}
.empty p{margin:14px 0 26px;color:var(--muted)}

/* Schrank */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 12px}
.tile{text-align:left;display:block;width:100%}
.ph{aspect-ratio:4/5;background:var(--stage);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain}
.tile .meta{font-size:14px;margin-top:7px;display:flex;align-items:center;gap:7px}
.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0 18px;margin-bottom:22px}

/* Hinzufügen */
.addbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;aspect-ratio:3/2;background:var(--soft);cursor:pointer;font-size:15px;text-align:center;padding:10px}
.bigbtn svg{width:30px;height:30px}
.bigbtn:hover{filter:brightness(.97)}
.hint{color:var(--muted);font-size:14px;margin:14px 0 4px;max-width:560px}
.mstatus{font-size:14px;min-height:1.4em;margin-bottom:10px}
.rcard{display:grid;grid-template-columns:128px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line);max-width:760px}
.rcard .ph{width:128px}
.rcard .field:first-child{margin-top:0}
.keep{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}
.keep input{width:18px;height:18px;accent-color:var(--loden)}
.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;background:var(--bg);padding:14px 0;border-top:1px solid var(--line);max-width:760px}
@media (min-width:800px){.savebar{bottom:0}}

/* Anziehen */
.dress{max-width:560px;margin:0 auto}
.dbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.dbar .icbtn{margin-left:auto;border:1px solid var(--line)}
.dbar .icbtn svg{width:19px;height:19px}
.dress .chips.scroll{margin-bottom:16px}
.row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px;margin-bottom:8px}
.arrow{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.arrow:hover:not(:disabled){background:var(--soft)}
.stage{position:relative;background:var(--stage);height:var(--h);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.stage.soda{background:linear-gradient(135deg,#ff0059,#ff8a00,#ffe600,#28e07a,#00c3ff,#8b5cf6,#ff0059);background-size:400% 400%;animation:sodarainbow 5s ease infinite}
@keyframes sodarainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.sodawrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;width:100%}
.sodacan{max-height:62%;max-width:65%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.sodalabel{text-align:center;color:#fff;font-weight:700;font-size:.85rem;text-shadow:0 1px 4px rgba(0,0,0,.5);letter-spacing:.02em}
.stage img{height:100%;width:100%;max-width:72%;object-fit:contain;padding:6px;-webkit-user-drag:none}
.stage img.in-r{animation:inR .22s ease-out}
.stage img.in-l{animation:inL .22s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(24px)}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}}
.rowctl{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center}
.ic svg{width:17px;height:17px}
.ic.on{background:#141414;color:#fff}
.rowlabel{position:absolute;left:10px;bottom:7px;font-size:12px;color:var(--muted)}
.hiddenrows{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 0 48px;font-size:14px}
.dactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 0}
.dactions .wide{grid-column:1/-1}
.desc{margin:16px 0 0 48px;padding:12px 14px;background:var(--soft);font-size:15px;line-height:1.5}
.desc.loading{color:var(--muted)}
.desc .occ{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.odesc{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.olinks{display:flex;flex-wrap:wrap;gap:4px 14px}
.share{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 40px}
.share .logo{display:block;margin-bottom:22px}
.share .stack{background:var(--stage);display:flex;flex-direction:column;gap:4px;padding:14px;margin:18px 0}
.share .stack img{max-height:28vh;width:100%;object-fit:contain}

/* Outfits */
.folder{margin-bottom:34px}
.fhead{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.fhead .linkbtn{margin-left:auto}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 12px}
.ostack{width:100%;aspect-ratio:3/4;background:var(--stage);display:flex;flex-direction:column;padding:8px;gap:2px}
.ostack img{flex:1 1 0;min-height:0;width:100%;object-fit:contain}
.oname{display:flex;flex-direction:column;gap:4px;margin-top:7px;font-size:15px;min-width:0}
.oname>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (min-width:800px){.sheet{align-items:center}.panel{border-radius:4px}}
.phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ph.edit{max-width:340px;margin:0 auto}
.spinner.over{position:absolute}
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 4px}
.tool{border:1px solid var(--line);border-radius:2px;min-width:44px;height:40px;padding:0 10px;display:grid;place-items:center;font-size:14px}
.tool svg{width:18px;height:18px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.erwrap{background:var(--stage);max-width:420px;margin:12px auto 0;aspect-ratio:4/5}
.erwrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.cardlinks{display:flex;gap:14px;margin-top:8px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:100%;max-width:360px}
.login .logo{font-size:44px;margin-bottom:28px;display:block}
.login label{display:block;font-size:14px;margin:14px 0 6px}
.login .btn{width:100%;margin-top:22px}
.login .err{color:var(--danger);font-size:14px;margin-top:12px;min-height:1.4em}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;font-size:14px;z-index:60;max-width:90vw;display:flex;align-items:center;gap:16px}
.toast .tundo{color:var(--bg);font-weight:500;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.tile{position:relative}
.tile .check{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);display:grid;place-items:center}
.tile.sel .check{background:var(--loden);border-color:var(--loden)}
.tile.sel .ph{outline:3px solid var(--loden);outline-offset:-3px}
.tile .check svg{width:16px;height:16px;color:#fff}
.bulkbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);margin-top:18px}
@media (min-width:800px){.bulkbar{bottom:0}}
.bulkbar .count{margin-right:auto}
.bulkrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.bulkrow span{margin-right:auto}
.editing{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:14px;background:var(--soft);padding:10px 12px}
.editing span{margin-right:auto}
.wearbtn svg{width:20px;height:20px}
.toast[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}.spinner{animation-duration:1.5s!important}}
.wx{font-size:.82rem;color:var(--muted,#777);margin:-4px 0 8px}
.wx3{font-size:.78rem;color:var(--muted,#777);margin:-4px 0 10px}
.stageimg{background:none;border:0;padding:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.sw.none{background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#999}
.viewbig{width:100%;max-height:52vh;object-fit:contain;background:#eee;border-radius:12px}
.viewfield{margin:6px 0}.viewfield h3{margin:0 0 2px;font-size:.8rem;color:var(--muted,#777)}
.viewgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.viewgrid .viewfield{margin:4px 0}
</style>
</head>

const configured = !SUPABASE_URL.startsWith('HIER') && !SUPABASE_KEY.startsWith('HIER');
const sb = configured ? createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const S = {
  user:null, items:[], urls:{}, urlTime:0, folders:[], outfits:[],
  view:'schrank', filterOpen:false,
  f:{cats:new Set(), colors:new Set(), styles:new Set(), seasons:new Set()},
  d:loadDressPrefs(), queue:[], mstatus:'', sheetMode:null, edit:null, osave:null, bg:{}, menuStep:null,
};
function loadDressPrefs(){
  let p={}; try{ p=JSON.parse(localStorage.getItem('gk-dress')||'{}'); }catch{}
  return {sel:{}, locked:new Set(), hidden:new Set(p.hidden||['acc','hemden']), kleid:!!p.kleid, seasonOn:p.seasonOn!==false, hideKleid:!!p.hideKleid, hideHeel:!!p.hideHeel, hideLoan:!!p.hideLoan, style:'', anim:null};
}
function saveDressPrefs(){
  try{ localStorage.setItem('gk-dress', JSON.stringify({hidden:[...S.d.hidden], kleid:S.d.kleid, seasonOn:S.d.seasonOn, hideKleid:S.d.hideKleid, hideHeel:S.d.hideHeel, hideLoan:S.d.hideLoan})); }catch{}
}

const app = document.getElementById('app');
const sheet = document.getElementById('sheet');
const esc = (s) => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url = (i) => i ? (S.urls[i.image_path]?.url || '') : '';
const chip = (label,on,attrs) => `<button class="chip ${on?'on':''}" ${attrs} aria-pressed="${on}">${esc(label)}</button>`;
let toastT;
function toast(msg, undo){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button class="tundo" data-a="undo">Rückgängig</button>':''}`;
  t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, undo?6000:2800);
}
// Löschen mit Rückgängig: sofort ausblenden, erst nach 6 Sekunden wirklich ausführen
let undoState=null;
function withUndo(msg, revert, commit){
  flushUndo();
  const timer=setTimeout(()=>{ const u=undoState; undoState=null; u?.commit(); }, 6000);
  undoState={revert, commit, timer};
  toast(msg, true);
}
function flushUndo(){ if(!undoState) return; clearTimeout(undoState.timer); const u=undoState; undoState=null; u.commit(); }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushUndo(); });
function status(msg){ S.mstatus=msg; const el=document.getElementById('mstatus'); if(el) el.textContent=msg; }

/* ---------------- Start & Login ---------------- */
async function boot(){
  if(!sb){
    app.innerHTML = `<div class="login"><div><span class="logo">Gwandkastl</span><p>Fast fertig: Trage in <b>index.html</b> ganz oben im Skript deine Supabase-Projekt-URL und deinen Key ein. Die Schritte stehen in ANLEITUNG.md.</p></div></div>`;
    return;
  }
  const shareToken=new URLSearchParams(location.search).get('s');
  if(shareToken){ renderShare(shareToken); return; }
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ S.user=null; renderLogin(); } });
  let session=null;
  try{ ({ data:{ session } } = await sb.auth.getSession()); }catch{}
  if(session){ S.user=session.user; await start(); }
  else if(!navigator.onLine && loadSnapshot()){ goOffline(); }
  else renderLogin();
}
async function start(){
  app.innerHTML = `<div class="login"><div class="spinner"></div></div>`;
  for(let attempt=0; attempt<4; attempt++){
    try{ await loadAll(); saveSnapshot(); setBg('offline',null); render(); runPending(); checkLoanReminders(); return; }
    catch(e){
      if((!navigator.onLine || /fetch|network|load failed/i.test(e.message||'')) && loadSnapshot()){ goOffline(); return; }
      // Frisch ausgestellte Anmeldung kann Sekundenbruchteile "aus der Zukunft" kommen – kurz warten und nochmal
      if(/future|iat/i.test(e.message||'') && attempt<3){ await new Promise(r=>setTimeout(r,1500)); continue; }
      console.error(e);
      app.innerHTML = `<div class="login"><div style="max-width:420px"><span class="logo">Gwandkastl</span><p>Die Daten konnten nicht geladen werden. Wurde <b>supabase-setup.sql</b> im SQL-Editor ausgeführt?</p><p class="muted small" style="margin-top:10px">${esc(e.message||e)}</p><button class="btn" style="margin-top:20px" onclick="location.reload()">Neu laden</button></div></div>`;
      return;
    }
  }
}
function renderLogin(){
  sheet.hidden=true;
  app.innerHTML = `<div class="login"><form id="lf" novalidate>
    <span class="logo">Gwandkastl</span>
    <label for="em">E-Mail</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Anmelden</button>
    <p class="err" id="lerr"></p>
    <p class="muted small">Noch kein Zugang? Das Konto legt Eugen für dich an.</p>
  </form></div>`;
  document.getElementById('lf').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn=e.target.querySelector('button'); btn.disabled=true;
    const { data, error } = await sb.auth.signInWithPassword({ email:document.getElementById('em').value.trim(), password:document.getElementById('pw').value });
    btn.disabled=false;
    if(error){ document.getElementById('lerr').textContent='E-Mail oder Passwort stimmt nicht.'; return; }
    S.user=data.user; await start();
  });
}

/* ---- Offline: letzter Stand im Browser ---- */
function saveSnapshot(){
  try{ localStorage.setItem('gk-snap', JSON.stringify({user:{id:S.user.id,email:S.user.email,user_metadata:S.user.user_metadata}, items:S.items, folders:S.folders, outfits:S.outfits, urls:S.urls})); }catch{}
}
function loadSnapshot(){
  try{ const s=JSON.parse(localStorage.getItem('gk-snap')||'null'); if(!s) return false;
    if(S.user && s.user.id!==S.user.id) return false;
    S.user=S.user||s.user; S.items=s.items; S.folders=s.folders; S.outfits=s.outfits; S.urls=s.urls||{}; S.urlTime=Date.now(); return true; }
  catch{ return false; }
}
function goOffline(){
  S.offline=true; render();
  setBg('offline',{text:'Offline: Du siehst den letzten Stand. Hinzufügen und Ändern geht wieder mit Internet.', p:null, err:true});
  addEventListener('online', ()=>location.reload(), {once:true});
}
async function loadAll(){
  const [it,fo,ou] = await Promise.all([
    sb.from('items').select('*').eq('user_id', S.user.id).order('created_at'),
    sb.from('folders').select('*').order('name'),
    sb.from('outfits').select('*').order('created_at'),
  ]);
  for(const r of [it,fo,ou]) if(r.error) throw r.error;
  S.items=it.data; S.folders=fo.data; S.outfits=ou.data;
  const wo=await sb.from('worn').select('*').gte('worn_at', new Date(Date.now()-90*864e5).toISOString()).order('worn_at',{ascending:false}).limit(300);
  S.worn=wo.error?[]:wo.data;     // fehlt die Tabelle noch, geht der Rest trotzdem
  await refreshUrls(true);
}
async function refreshUrls(all){
  const paths = S.items.map(i=>i.image_path).filter(p=>all || !S.urls[p]);
  S.urlTime = Date.now();
  if(!paths.length) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(paths, 60*60*8);
  if(error){ console.error(error); return; }
  data.forEach(d=>{ if(d.signedUrl && d.path) S.urls[d.path]={url:d.signedUrl}; });
}

function filtered(){
  const f=S.f, q=(S.search||'').trim().toLowerCase();
  return S.items.filter(i =>
    (!f.cats.size || f.cats.has(i.category)) &&
    (!f.colors.size || f.colors.has(i.color)) &&
    (!f.styles.size || (i.styles||[]).some(s=>f.styles.has(s))) &&
    (!f.seasons.size || !(i.seasons||[]).length || i.seasons.some(s=>f.seasons.has(s))) &&
    (!q || [i.category,i.color,i.color2,i.material,i.pattern,i.note,...(i.styles||[]),...(i.seasons||[])].filter(Boolean).some(x=>x.toLowerCase().includes(q))));
}

  </div>`;

async function bulkApply(op, val){
  const key=S.bulkKey, ids=[...S.sel]; closeSheet();
  setBg('backup',{text:`${ids.length} Teile werden geändert …`, p:null});
  let fail=0;
  for(let k=0;k<ids.length;k+=8){
    await Promise.all(ids.slice(k,k+8).map(async id=>{
      const it=S.items.find(i=>i.id===id); if(!it) return;
      const cur=it[key]||[], next=op==='add'?[...new Set([...cur,val])]:cur.filter(x=>x!==val);
      if(next.length===cur.length && next.every(x=>cur.includes(x))) return;
      const {data,error}=await sb.from('items').update({[key]:next, edited:true, pending:false}).eq('id',id).select().single();
      if(error) fail++; else Object.assign(it,data);
    }));
  }
  setBg('backup',null); render(); saveSnapshot();
  toast(fail?`${fail} Teile konnten nicht geändert werden`:`„${val}“ ${op==='add'?'hinzugefügt':'entfernt'}`);
}
function deleteItems(list){
  const before=S.items.slice();
  S.items=S.items.filter(i=>!list.includes(i)); S.sel=null; closeSheet(); render();
  withUndo(list.length===1?'Teil gelöscht':`${list.length} Teile gelöscht`,
    ()=>{ S.items=before; render(); },
    async()=>{
      const {error}=await sb.from('items').delete().in('id',list.map(i=>i.id));
      if(error){ toast('Löschen fehlgeschlagen'); S.items=before; render(); return; }
      await sb.storage.from(BUCKET).remove(list.map(i=>i.image_path)); saveSnapshot();
    });
}

function qCard(q){
  if(q.status==='wait' || q.status==='work') return `<div class="rcard" data-card="${q.id}"><div class="ph">${q.status==='work'?CHARLY:''}</div>
    <div><p class="step">${q.status==='wait'?'Wartet …':esc(q.step)}</p><p class="muted small">${esc(q.file.name)}</p></div></div>`;
  if(q.status==='err') return `<div class="rcard"><div class="ph"></div><div><p>${esc(q.err)}</p><p class="muted small">${esc(q.file.name)}</p>
    <button class="linkbtn" data-a="q-retry" data-i="${q.id}" style="margin-top:8px">Nochmal versuchen</button>
    <button class="linkbtn" data-a="q-remove" data-i="${q.id}" style="margin-top:8px">Entfernen</button></div></div>`;
  let dup='';
  if(q.dup){
    const src = q.dup.item ? url(S.items.find(i=>i.id===q.dup.item)) : (S.queue.find(x=>x.id===q.dup.q)?.preview||'');
    dup = `<div class="note">${src?`<img src="${src}" alt="">`:''}<span>Sieht aus wie ein Teil, das schon ${q.dup.item?'im Kastl':'in dieser Auswahl'} ist.</span></div>`;
  }
  return `<div class="rcard"><div><button class="ph" data-a="q-zoom" data-i="${q.id}" style="display:block;width:100%;padding:0;border:0"><img src="${q.preview}" alt="Freigestelltes Teil"></button>
    <label class="keep"><input type="checkbox" data-c="q-keep" data-i="${q.id}" ${q.keep?'checked':''}> Übernehmen</label>
    <div class="cardlinks"><button class="linkbtn" data-a="q-erase" data-i="${q.id}">Radieren</button><button class="linkbtn" data-a="q-retry" data-i="${q.id}">Nochmal einlesen</button></div>${q.retryCount?`<p class="muted small">${q.retryCount+1}. Versuch${q.retryCount===1?', Aufräumen vorsichtiger':', ohne automatisches Aufräumen'}</p>`:''}</div>
    <div>${dup}${q.pending?`<p class="note">${q.recErr?esc(q.recErr):'Charly konnte das Teil nicht erkennen'}. Er versucht es nach dem Speichern nochmal, oder du ordnest selbst ein.</p>`:''}${fieldsHTML(q,'q',q.id)}</div></div>`;
}
function addFiles(files){
  for(const f of files){
    const sig = f.name+'|'+f.size+'|'+f.lastModified;
    const twin = S.queue.find(q=>q.sig===sig);
    S.queue.push({id:crypto.randomUUID(), file:f, sig, status:'wait', step:'', keep:!twin, cat:'T-Shirt', color:'', color2:'', styles:[], seasons:[], material:'', pattern:'', note:'', bagSize:'', heel:'', shaft:'', fit:'', dup:twin?{q:twin.id}:null});
  }
  render();
  setTimeout(processQueue, 0);   // Browser erst zeichnen lassen, bevor die Bildverarbeitung des ersten Fotos den Hauptthread blockiert
}
let processing=false, queueCancelled=false;
async function processQueue(){
  if(processing) return; processing=true;
  let q;
  while(!queueCancelled && (q = S.queue.find(x=>x.status==='wait'))){
    q.status='work'; q.step='Wird vorbereitet …';
    queueProgress();
    if(S.view==='add') render();
    try{ await processOne(q); q.status='done'; }
    catch(e){ console.error(e); q.status='err'; q.err = e.message || 'Das Foto konnte nicht verarbeitet werden.'; }
    if(S.view==='add') render();
  }
  processing=false; queueCancelled=false; status(''); setBg('queue',null); runPending();
}
function cancelQueue(){
  queueCancelled=true;
  S.queue=S.queue.filter(q=>q.status!=='wait');   // noch nicht begonnene Fotos verwerfen; das gerade laufende wird noch fertig
  toast('Verarbeitung wird nach dem aktuellen Foto gestoppt');
  render();
}
function queueProgress(){
  const list=S.queue.filter(x=>x.status!=='saved'), done=list.filter(x=>x.status==='done'||x.status==='err').length;
  setBg('queue',{text:`Charly verarbeitet Foto ${Math.min(done+1,list.length)} von ${list.length} …`, p:done/list.length, charly:true});
}
function setStep(q,msg){ q.step=msg; const el=document.querySelector(`[data-card="${q.id}"] .step`); if(el) el.textContent=msg; }

async function processOne(q){
  const src = await fileToCanvas(q.file, 1600);
  await yieldFrame();
  let rec=q.preset||null;
  if(!rec){
    setStep(q,'Charly schaut sich das Foto an …');
    try{
      const r = await gemini({task:'detect', image:photoB64(src,1024,false)}, ()=>setStep(q,'Charly ist gleich bei dir …'));
      const list=(Array.isArray(r.items)?r.items:[]).map(cleanRec).slice(0,8);
      if(list.length){
        rec=list[0];
        if(list.length>1){   // weitere Teile auf demselben Foto: eigene Karten
          const extra=list.slice(1).map((p,k)=>({id:crypto.randomUUID(), file:q.file, sig:q.sig+'#'+(k+1), status:'wait', step:'', keep:true,
            cat:'T-Shirt', color:'', styles:[], seasons:[], dup:null, preset:p}));
          S.queue.splice(S.queue.indexOf(q)+1, 0, ...extra);
          toast(`Charly hat ${list.length} Teile auf dem Foto gefunden`);
        }
      }else q.recErr='Charly sieht hier kein Kleidungsstück (leer)';
    }catch(e){ console.warn('Erkennung nicht verfügbar', e); q.recErr=e.message; }
  }
  let box=rec?.box, hung=false;
  if(box && rec.hangerBottom>0){    // Kleiderbügel/Haken oben abschneiden – mit Sicherheitsabstand, damit Kragen/Schultern nicht mit abgeschnitten werden
    const [y0,,y1]=box, hb=rec.hangerBottom, margin=(y1-y0)*.05;
    if(hb>y0 && hb<y0+(y1-y0)*.3){ box=[Math.max(y0,hb-margin),box[1],box[2],box[3]]; hung=true; }
  }
  const work = box ? cropToBox(src, box, hung) : src;
  setStep(q,'Charly schneidet das Teil aus …');
  const remove = await getRemover();
  const cutBlob = await remove(await canvasToBlob(work, 'image/jpeg', .92));
  setStep(q,'Charly richtet es schön her …');
  let cut = await blobToCanvas(cutBlob);
  fillEnclosedHoles(cut, work);     // eingeschlossene Löcher mitten im Teil zurückholen, unabhängig von der Farbe
  restoreDarkMistakes(cut, work);   // zusätzlich: dunkle, fälschlich entfernte Stellen (z. B. Innenfutter) auf weißem Hintergrund zurückholen
  await yieldFrame();
  if(rec && Math.abs(rec.tilt)>=1.5) cut = rotateCanvas(cut, -rec.tilt);     // Schieflage laut Charly ausgleichen
  // Beim "Nochmal einlesen" wird das automatische Aufräumen mit jedem Versuch vorsichtiger, ab dem 3. Versuch ganz aus, der Rest wird dann von Hand radiert.
  const attempt=q.retryCount||0;
  const cleanOpt = attempt<=0 ? true : attempt===1 ? .03 : false;
  const out = await prepareCutout(cut, {clean:cleanOpt, straighten:true, level:true});   // Bügel-Ausschnitt entfernt den Haken, alte Geraderichtung bleibt zusätzlich aktiv
  q.blob = await exportImage(out);
  q.preview = URL.createObjectURL(q.blob);
  q.hash = dhash(out);
  if(out.tiny){
    q.cat='Accessoires';
    if(rec){ q.color=rec.color; q.color2=rec.color2; q.styles=rec.styles; q.seasons=rec.seasons; q.material=rec.material; q.pattern=rec.pattern; }
    else q.color=detectColor(out);
    q.shaft=''; q.fit=''; q.pending=true; q.recErr='Nur ein kleiner Bereich erkannt, automatisch als Accessoire eingestuft, bitte kurz prüfen';
  }
  else if(rec){ q.cat=rec.category; q.color=rec.color; q.color2=rec.color2; q.styles=rec.styles; q.seasons=rec.seasons; q.material=rec.material; q.pattern=rec.pattern; q.shaft=(rec.shaft&&rec.shaft!=='Nicht zutreffend')?rec.shaft:''; q.fit=(rec.fit&&FIT_CATS.includes(rec.category))?rec.fit:''; q.pending=false; }
  else { q.color=detectColor(out); q.pending=true; }
  if(!q.dup){ const d = findDuplicate(q); if(d){ q.dup=d; q.keep=false; } }
}

/* ---- KI-Modelle (werden beim ersten Mal geladen und dann vom Browser zwischengespeichert) ---- */
let removerP=null;
function getRemover(){
  if(!removerP) removerP = import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm').then(m=>{
    const fn = m.removeBackground || m.default;
    const cfg = {model:'isnet_fp16', output:{format:'image/png'},
      progress:(k,c,t)=>{ if(t && c<t) status(`Freisteller wird geladen (nur beim ersten Mal) … ${Math.round(c/t*100)} %`); else status(''); }};
    return (blob)=>fn(blob, cfg);
  }).catch(e=>{ removerP=null; throw new Error('Der Freisteller konnte nicht geladen werden. Internetverbindung prüfen.'); });
  return removerP;
}
/* ---- Erkennung mit Gemini (über Supabase Edge Function "classify") ---- */
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
const GEM_GAP=6500;              // Gratis-Tarif: max. ~10 Anfragen pro Minute
let gemNext=0, gemChain=Promise.resolve();
function gemini(body, onWait){
  const run = gemChain.then(async()=>{
    const wait=gemNext-Date.now();
    if(wait>0){ onWait?.(); await sleep(wait); }
    gemNext=Date.now()+GEM_GAP;
    const {data,error}=await sb.functions.invoke('classify',{body});
    if(error || !data || data.error){
      const status=error?.context?.status;
      let code=data?.error||'';
      if(!code && error?.context?.json){ try{ const b=await error.context.clone().json(); code=b?.error||b?.msg||b?.message||''; }catch{} }
      const err=new Error(errText(status,code,error?.message));
      err.rate = status===429 || code==='rate_limit';
      if(err.rate) gemNext=Date.now()+60000;
      throw err;
    }
    if(data.fn_version) S.fnVersion=data.fn_version;
    return data;
  });
  gemChain = run.catch(()=>{});
  return run;
}
function errText(status,code,msg){
  code=String(code||'');
  if(status===429 || code==='rate_limit') return 'Charly braucht eine Pause, das Gratis-Limit ist erreicht (429)';
  if(status===401 || (status===403 && !code.startsWith('gemini'))) return 'Charly wird nicht reingelassen – bei der Funktion „Verify JWT“ ausschalten ('+status+')';
  if(status===404 && !code.startsWith('gemini')) return 'Charly findet seinen Arbeitsplatz nicht – Funktion „classify“ fehlt (404)';
  if(code==='no_key') return 'Charly findet seinen Schlüssel nicht – Secret GEMINI_API_KEY anlegen (no_key)';
  if(code==='gemini_400' || code==='gemini_403') return 'Charlys Schlüssel passt nicht – Gemini-Key prüfen ('+code+')';
  if(code==='gemini_404') return 'Charly kennt dieses Modell nicht ('+code+')';
  if(/^gemini_5\d\d$/.test(code)) return 'Charly ist gerade überlastet, versuch\'s gleich nochmal ('+code+')';
  if(code.startsWith('gemini_')) return 'Charly hat ein Problem bei Google ('+code+')';
  if(code==='bad_request') return 'Charly konnte das Bild nicht empfangen (bad_request)';
  if(code==='server') return 'Charly ist gestolpert (server)';
  if(code) return 'Charly hat ein Problem ('+code+(status?', '+status:'')+')';
  if(!navigator.onLine) return 'Charly hat gerade kein Internet (offline)';
  return 'Charly ist nicht erreichbar ('+(status||msg||'unbekannt')+')';
}
function cleanRec(r){
  const pick=(v,list,def)=>list.includes(v)?v:def;
  const arr=(v,list)=>Array.isArray(v)?[...new Set(v.filter(x=>list.includes(x)))]:[];
  const col2=Object.keys(COLORS).includes(r.color2)&&r.color2!==r.color?r.color2:'';
  return {category:pick(r.category,CATS,'T-Shirt'), color:pick(r.color,Object.keys(COLORS),'Grau'), color2:col2,
    styles:arr(r.styles,STYLES), seasons:arr(r.seasons,SEASONS), material:pick(r.material,MATERIALS,''),
    pattern:pick(r.pattern,PATTERNS,''), shaft:pick(r.shaft,SHAFT_HEIGHTS,''), fit:pick(r.fit,FITS,''),
    box:Array.isArray(r.box)&&r.box.length===4?r.box.map(Number):null,
    tilt:Math.max(-30,Math.min(30,Number(r.tilt)||0)), hangerBottom:Math.max(0,Math.min(1000,Number(r.hanger_bottom)||0))};
}
function photoB64(c,max,white){
  const s=Math.min(1,max/Math.max(c.width,c.height)), o=mk(c.width*s,c.height*s), x=ctx(o);
  if(white){ x.fillStyle='#fff'; x.fillRect(0,0,o.width,o.height); }
  x.drawImage(c,0,0,o.width,o.height);
  return o.toDataURL('image/jpeg',.85).split(',')[1];
}
// Box von Gemini: [ymin, xmin, ymax, xmax] im Bereich 0–1000
function cropToBox(c,b,noTop){
  let [y0,x0,y1,x1]=b;
  if(![y0,x0,y1,x1].every(Number.isFinite) || y1<=y0 || x1<=x0) return c;
  if((y1-y0)*(x1-x0) < 30000) return c;          // unter 3 % der Fläche: lieber nicht zuschneiden
  const mx=(x1-x0)*.05, my=(y1-y0)*.05;
  x0=Math.max(0,x0-mx); y0=noTop?y0:Math.max(0,y0-my); x1=Math.min(1000,x1+mx); y1=Math.min(1000,y1+my);
  const W=c.width/1000, H=c.height/1000;
  return crop(c,{x:Math.round(x0*W),y:Math.round(y0*H),w:Math.round((x1-x0)*W),h:Math.round((y1-y0)*H)},0);
}
// Ausstehende Erkennungen im Hintergrund nachholen
let pendingRunning=false, pendingTimer=null;
async function runPending(){
  if(pendingRunning || !sb || !S.user) return;
  const failed=new Set();
  const todo=()=>S.items.filter(i=>i.pending && !failed.has(i.id));
  if(!todo().length) return;
  pendingRunning=true;
  const total=todo().length; let done=0, tried=0, lastErr='';
  try{
    let it;
    while((it=todo()[0])){
      setBg('recog',{text:`Charly erkennt Teil ${tried+1} von ${total} …`+(lastErr?`  Zuletzt: ${lastErr}`:''), p:tried/total, charly:true});
      tried++;
      try{
        const {data:blob,error:dErr}=await sb.storage.from(BUCKET).download(it.image_path);
        if(dErr) throw dErr;
        const r=cleanRec(await gemini({task:'classify', image:photoB64(await blobToCanvas(blob),768,true)}));
        const {data,error}=await sb.from('items').update({category:r.category,color:r.color,color2:r.color2||null,styles:r.styles,seasons:r.seasons,material:r.material||null,pattern:r.pattern||null,shaft:(r.shaft&&r.shaft!=='Nicht zutreffend')?r.shaft:null,pending:false}).eq('id',it.id).select().single();
        if(error) throw error;
        Object.assign(it,data); done++;
        if(S.view==='schrank' || S.view==='dress') render();
      }catch(e){
        console.warn('Erkennung fehlgeschlagen', e);
        lastErr=e.message;
        if(e.rate){ break; }
        failed.add(it.id);
      }
    }
    if(done<total){
      setBg('recog',{text:`Charly hat ${done} von ${total} geschafft. ${lastErr||'Unbekanntes Problem'}. Er versucht es in 10 Minuten nochmal.`, p:done/total, err:true});
      await sleep(12000);
    }
  }finally{
    pendingRunning=false; setBg('recog',null);
    clearTimeout(pendingTimer); pendingTimer=setTimeout(runPending, 3*60e3);
  }
}

async function restoreBackup(file){
  closeSheet();
  try{
    setBg('backup',{text:'Sicherung wird gelesen …', p:null});
    const JSZip=await loadJSZip(), zip=await JSZip.loadAsync(file);
    const meta=JSON.parse(await zip.file('data.json').async('string'));
    const haveIds=new Set(S.items.map(i=>i.id)), haveHash=new Set(S.items.map(i=>i.hash).filter(Boolean));
    const idMap={}; let added=0, skipped=0;
    const list=meta.items||[];
    for(let k=0;k<list.length;k++){
      const it=list[k];
      setBg('backup',{text:`Wiederherstellen: ${k+1} von ${list.length} …`, p:k/list.length});
      if(haveIds.has(it.id) || (it.hash && haveHash.has(it.hash))){ idMap[it.id]=haveIds.has(it.id)?it.id:(S.items.find(x=>x.hash===it.hash)?.id); skipped++; continue; }
      const f=zip.file(it.file); if(!f){ skipped++; continue; }
      const blob=await f.async('blob');
      const ext=it.file.endsWith('.png')?'png':'webp';
      const path=`${S.user.id}/${crypto.randomUUID()}.${ext}`;
      const up=await sb.storage.from(BUCKET).upload(path, blob, {contentType:'image/'+ext});
      if(up.error) throw up.error;
      const row={image_path:path, category:it.category, color:it.color, color2:it.color2||null, styles:it.styles||[], seasons:it.seasons||[], material:it.material||null, pattern:it.pattern||null, note:it.note||null, bag_size:it.bag_size||null, heel:it.heel||null, shaft:it.shaft||null, fit:it.fit||null, hash:it.hash||null, pending:!!it.pending, edited:!!it.edited, created_at:it.created_at};
      let res=await sb.from('items').insert({...row, id:it.id}).select().single();
      if(res.error) res=await sb.from('items').insert(row).select().single();
      if(res.error){ await sb.storage.from(BUCKET).remove([path]); throw res.error; }
      S.items.push(res.data); idMap[it.id]=res.data.id; haveHash.add(it.hash); added++;
    }
    const fMap={};
    for(const f of (meta.folders||[])){
      const ex=S.folders.find(x=>x.id===f.id || x.name===f.name);
      if(ex){ fMap[f.id]=ex.id; continue; }
      const {data,error}=await sb.from('folders').insert({name:f.name}).select().single();
      if(!error){ S.folders.push(data); fMap[f.id]=data.id; }
    }
    for(const o of (meta.outfits||[])){

/* ---------------- Bildbearbeitung ---------------- */
function mk(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w)); c.height=Math.max(1,Math.round(h)); return c; }
const ctx = (c) => c.getContext('2d',{willReadFrequently:true});
// Weißer Hintergrund fest angenommen: dunkle Punkte, die die Freistellung entfernt hat, können nie der Hintergrund
// gewesen sein (z. B. dunkles Innenfutter, das mit dem Hintergrund verwechselt wird) - werden zurückgeholt.
// Eingeschlossenes Loch (nirgends mit dem Bildrand verbunden) kann nie echter Hintergrund sein, egal welche Helligkeit/Farbe -
// wird unabhängig von restoreDarkMistakes zurückgeholt (deckt z. B. glänzende Stellen auf schwarzem Leder ab).
function fillEnclosedHoles(cutCanvas, origCanvas){
  const w=cutCanvas.width, h=cutCanvas.height, N=w*h;
  if(origCanvas.width!==w || origCanvas.height!==h) return;
  const cx=ctx(cutCanvas), ox=ctx(origCanvas);
  const cd=cx.getImageData(0,0,w,h), od=ox.getImageData(0,0,w,h);
  const cdata=cd.data, odata=od.data;
  const transparent=new Uint8Array(N);
  for(let p=0;p<N;p++) transparent[p]=cdata[p*4+3]<128?1:0;
  const outside=new Uint8Array(N), stack=new Int32Array(N); let sp=0;
  const push=(p)=>{ if(transparent[p] && !outside[p]){ outside[p]=1; stack[sp++]=p; } };
  for(let x=0;x<w;x++){ push(x); push((h-1)*w+x); }
  for(let y=0;y<h;y++){ push(y*w); push(y*w+(w-1)); }
  while(sp){
    const q=stack[--sp], qx=q%w;
    if(qx>0   ) push(q-1);
    if(qx<w-1 ) push(q+1);
    if(q>=w   ) push(q-w);
    if(q<N-w  ) push(q+w);
  }
  let restored=0;
  for(let p=0;p<N;p++){
    if(transparent[p] && !outside[p]){
      cdata[p*4]=odata[p*4]; cdata[p*4+1]=odata[p*4+1]; cdata[p*4+2]=odata[p*4+2]; cdata[p*4+3]=255;
      restored++;
    }
  }
  if(restored) cx.putImageData(cd,0,0);
}
function restoreDarkMistakes(cutCanvas, origCanvas, threshold=130){
  const w=cutCanvas.width, h=cutCanvas.height;
  if(origCanvas.width!==w || origCanvas.height!==h) return;
  const cx=ctx(cutCanvas), ox=ctx(origCanvas);
  const cd=cx.getImageData(0,0,w,h), od=ox.getImageData(0,0,w,h);
  const cdata=cd.data, odata=od.data;
  for(let p=0;p<w*h;p++){
    const ai=p*4+3;
    if(cdata[ai]<128){
      const r=odata[p*4], g=odata[p*4+1], b=odata[p*4+2];
      if(0.299*r+0.587*g+0.114*b < threshold){ cdata[p*4]=r; cdata[p*4+1]=g; cdata[p*4+2]=b; cdata[ai]=255; }
    }
  }
  cx.putImageData(cd,0,0);
}
function canvasToBlob(c,type,q){ return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Bild konnte nicht erzeugt werden.')),type,q)); }
async function toDrawable(blob){
  try{ return await createImageBitmap(blob,{imageOrientation:'from-image'}); }
  catch{ return await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('Dieses Bildformat kann nicht gelesen werden.')); im.src=URL.createObjectURL(blob); }); }
}
async function fileToCanvas(file,max){
  const b = await toDrawable(file);
  const s = Math.min(1, max/Math.max(b.width,b.height));
  const c = mk(b.width*s, b.height*s); ctx(c).drawImage(b,0,0,c.width,c.height); return c;
}
async function blobToCanvas(blob){ const b=await toDrawable(blob); const c=mk(b.width,b.height); ctx(c).drawImage(b,0,0); return c; }
function alphaBBox(c,th=24){
  const {width:w,height:h}=c, d=ctx(c).getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]>th){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  return x1<0 ? null : {x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
function crop(c,b,pad=0){ const o=mk(b.w+2*pad,b.h+2*pad); ctx(o).drawImage(c,b.x,b.y,b.w,b.h,pad,pad,b.w,b.h); return o; }
function rotateCanvas(c,deg){
  const r=deg*Math.PI/180, cs=Math.abs(Math.cos(r)), sn=Math.abs(Math.sin(r));
  const o=mk(c.width*cs+c.height*sn, c.width*sn+c.height*cs), x=ctx(o);
  x.imageSmoothingQuality='high'; x.translate(o.width/2,o.height/2); x.rotate(r); x.drawImage(c,-c.width/2,-c.height/2); return o;
}
// Kleine Schieflage erkennen (Hauptachse der Form) und nur bis 15° korrigieren
function residualAngle(c){
  const {width:w,height:h}=c, d=ctx(c).getImageData(0,0,w,h).data;
  let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2) if(d[(y*w+x)*4+3]>128){ n++; sx+=x; sy+=y; sxx+=x*x; syy+=y*y; sxy+=x*y; }
  if(n<50) return 0;
  const mx=sx/n,my=sy/n, m20=sxx/n-mx*mx, m02=syy/n-my*my, m11=sxy/n-mx*my;
  const ecc = Math.sqrt((m20-m02)**2+4*m11*m11)/(m20+m02);
  let deg = .5*Math.atan2(2*m11, m20-m02)*180/Math.PI;
  deg = ((deg%90)+90)%90; if(deg>45) deg-=90;
  return (ecc<.12 || Math.abs(deg)<1.5 || Math.abs(deg)>15) ? 0 : deg;
}
// Helligkeit angleichen: helle Stellen auf gleiches Niveau bringen, dunkle Kleidung bleibt dunkel
function levelCanvas(c){
  const x=ctx(c), im=x.getImageData(0,0,c.width,c.height), d=im.data, hist=new Uint32Array(256);
  let n=0;
  for(let i=0;i<d.length;i+=4) if(d[i+3]>200){ hist[Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])]++; n++; }
  if(!n) return;
  let acc=0,p99=255; for(let v=0;v<256;v++){ acc+=hist[v]; if(acc>=n*.99){ p99=v; break; } }
  if(p99<100) return;
  const g=Math.min(1.3,Math.max(.92,245/p99));
  if(Math.abs(g-1)<.02) return;
  gainCanvas(c,g,im);
}
function gainCanvas(c,g,im){
  const x=ctx(c); im=im||x.getImageData(0,0,c.width,c.height); const d=im.data;
  for(let i=0;i<d.length;i+=4) if(d[i+3]){ d[i]=Math.min(255,d[i]*g); d[i+1]=Math.min(255,d[i+1]*g); d[i+2]=Math.min(255,d[i+2]*g); }
  x.putImageData(im,0,0);
}
const OUT_W=800, OUT_H=1000;
function fitCanvas(c){
  const pad=.08, s=Math.min(3, OUT_W*(1-2*pad)/c.width, OUT_H*(1-2*pad)/c.height);
  const o=mk(OUT_W,OUT_H), x=ctx(o); x.imageSmoothingQuality='high';
  x.drawImage(c,(OUT_W-c.width*s)/2,(OUT_H-c.height*s)/2,c.width*s,c.height*s); return o;
}
// Nur die Hauptfläche behalten: Teile, die nicht am Kleidungsstück hängen (Fuß, Türschnalle …), werden entfernt.
// Getrennte Flächen ab 30 % der größten bleiben (z. B. der zweite Schuh eines Paars).
function keepMainParts(c,threshold=.12){
  const w=c.width, h=c.height, N=w*h, x=ctx(c), im=x.getImageData(0,0,w,h), d=im.data;
  const raw=new Uint8Array(N);
  for(let p=0;p<N;p++) raw[p] = d[p*4+3]>128 ? 1 : 0;
  const bridged = dilate(raw,w,h,4);   // dünne Lücken (Nähte, Reißverschluss, Schattenlinien) vor der Analyse überbrücken, damit ein Teil nicht fälschlich in Stücke zerfällt
  const lab=new Int32Array(N), stack=new Int32Array(N), sizes=[0];
  let n=0;
  for(let p=0;p<N;p++){
    if(lab[p] || !bridged[p]) continue;
    n++; let sp=0, cnt=0; stack[sp++]=p; lab[p]=n;
    while(sp){
      const q=stack[--sp]; cnt++; const qx=q%w;
      if(qx>0     && !lab[q-1] && bridged[q-1]){ lab[q-1]=n; stack[sp++]=q-1; }
      if(qx<w-1   && !lab[q+1] && bridged[q+1]){ lab[q+1]=n; stack[sp++]=q+1; }
      if(q>=w     && !lab[q-w] && bridged[q-w]){ lab[q-w]=n; stack[sp++]=q-w; }
      if(q<N-w    && !lab[q+w] && bridged[q+w]){ lab[q+w]=n; stack[sp++]=q+w; }
    }
    sizes.push(cnt);
  }
  if(n<=1) return;
  let max=0; for(let i=1;i<=n;i++) if(sizes[i]>max) max=sizes[i];
  const keep=new Uint8Array(n+1); for(let i=1;i<=n;i++) keep[i]=sizes[i]>=max*threshold?1:0;   // deutlich vorsichtiger als vorher (war .3), damit echte, nur dünn verbundene Teile nicht verschwinden; wird bei "Nochmal einlesen" noch weiter herabgesetzt
  for(let p=0;p<N;p++) if(d[p*4+3]>128 && (!lab[p] || !keep[lab[p]])) d[p*4+3]=0;
  x.putImageData(im,0,0);
}
function dilate(m,w,h,r){
  const t=new Uint8Array(m.length), o=new Uint8Array(m.length);
  for(let y=0;y<h;y++){ let run=0; const row=y*w;
    for(let x=-r;x<w;x++){ const a=x+r, b=x-r-1; if(a<w && m[row+a]) run++; if(b>=0 && m[row+b]) run--; if(x>=0) t[row+x]=run>0?1:0; } }
  for(let x=0;x<w;x++){ let run=0;
    for(let y=-r;y<h;y++){ const a=y+r, b=y-r-1; if(a<h && t[a*w+x]) run++; if(b>=0 && t[b*w+x]) run--; if(y>=0) o[y*w+x]=run>0?1:0; } }
  return o;
}
const yieldFrame = () => new Promise(r=>setTimeout(r,0));
async function prepareCutout(src,opt={}){
  // In kleine Schritte mit Verschnaufpausen zerlegt, damit die Seite während der rechenintensiven
  // Bildbearbeitung nicht am Stück einfriert und weiter bedienbar bleibt.
  if(opt.clean){ keepMainParts(src, typeof opt.clean==='number'?opt.clean:.12); await yieldFrame(); }
  let b=alphaBBox(src);
  if(!b) throw new Error('Kein Kleidungsstück erkannt. Bitte auf ruhigerem Hintergrund fotografieren.');
  const tiny = b.w<20 || b.h<20;   // sehr kleiner Fund - vermutlich ein Accessoire statt eines echten Fehlers
  let c=crop(src,b,4);
  await yieldFrame();
  if(!tiny && opt.straighten){ const a=residualAngle(c); if(a){ c=rotateCanvas(c,-a); b=alphaBBox(c); if(b) c=crop(c,b,0); } await yieldFrame(); }
  if(!tiny && opt.level){ levelCanvas(c); await yieldFrame(); }
  const out = fitCanvas(c);
  out.tiny = tiny;
  return out;
}

// Hauptfarbe: jedes Pixel stimmt für die nächstgelegene Farbe (im Lab-Farbraum)
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function lab([r,g,b]){
  const f=v=>{ v/=255; return v>.04045?((v+.055)/1.055)**2.4:v/12.92; };
  const R=f(r),G=f(g),B=f(b);
  let X=(R*.4124+G*.3576+B*.1805)/.95047, Y=R*.2126+G*.7152+B*.0722, Z=(R*.0193+G*.1192+B*.9505)/1.08883;
  const t=v=>v>.008856?Math.cbrt(v):7.787*v+16/116; X=t(X);Y=t(Y);Z=t(Z);
  return [116*Y-16, 500*(X-Y), 200*(Y-Z)];
}
const REF_LAB = Object.entries(COLOR_REFS).flatMap(([n,hs])=>hs.map(h=>({n,l:lab(hexRgb(h))})));
function detectColor(c){
  const d=ctx(c).getImageData(0,0,c.width,c.height).data, votes={}, cache=new Map();
  for(let y=0;y<c.height;y+=3) for(let x=0;x<c.width;x+=3){
    const i=(y*c.width+x)*4; if(d[i+3]<220) continue;
    const key=(d[i]>>3)<<10|(d[i+1]>>3)<<5|(d[i+2]>>3);
    let name=cache.get(key);
    if(!name){ const L=lab([d[i],d[i+1],d[i+2]]); let best=1e9;
      for(const r of REF_LAB){ const e=(L[0]-r.l[0])**2+(L[1]-r.l[1])**2+(L[2]-r.l[2])**2; if(e<best){best=e;name=r.n;} }
      cache.set(key,name); }
    votes[name]=(votes[name]||0)+1;
  }
  return Object.entries(votes).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'Grau';
}
function dhash(c){
  const s=mk(9,8), x=ctx(s); x.fillStyle='#EEEEEB'; x.fillRect(0,0,9,8); x.drawImage(c,0,0,9,8);
  const d=x.getImageData(0,0,9,8).data; let bits='';
  for(let y=0;y<8;y++) for(let k=0;k<8;k++){ const a=(y*9+k)*4, b=a+4; bits += (d[a]+d[a+1]+d[a+2]) > (d[b]+d[b+1]+d[b+2]) ? '1':'0'; }
  let hex=''; for(let i=0;i<64;i+=4) hex+=parseInt(bits.slice(i,i+4),2).toString(16); return hex;
}
function hamming(a,b){ let n=0; for(let i=0;i<16;i++){ let v=parseInt(a[i],16)^parseInt(b[i],16); while(v){ n+=v&1; v>>=1; } } return n; }
function findDuplicate(q){
  const it=S.items.find(i=>i.hash && i.color===q.color && hamming(i.hash,q.hash)<=4);
  if(it) return {item:it.id};
  const other=S.queue.find(x=>x!==q && x.hash && x.status==='done' && x.color===q.color && hamming(x.hash,q.hash)<=4);
  return other ? {q:other.id} : null;
}

const BRUSH={s:14,m:30,l:60};
function openEraser(canvas,onDone,back){
  S.er={canvas, stack:[], size:'m', onDone, back};
  const cx=ctx(canvas); let last=null;
  const pos=(e)=>{ const r=canvas.getBoundingClientRect(), k=canvas.width/r.width; return [(e.clientX-r.left)*k,(e.clientY-r.top)*k,k]; };
  const draw=(a,b)=>{
    cx.save(); cx.globalCompositeOperation='destination-out'; cx.fillStyle=cx.strokeStyle='#000';
    const lw=BRUSH[S.er.size]*b[2];
    cx.beginPath(); cx.arc(b[0],b[1],lw/2,0,Math.PI*2); cx.fill();
    if(a!==b){ cx.lineWidth=lw; cx.lineCap='round'; cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke(); }
    cx.restore();
  };
  canvas.onpointerdown=(e)=>{
    e.preventDefault(); canvas.setPointerCapture?.(e.pointerId);
    S.er.stack.push(cx.getImageData(0,0,canvas.width,canvas.height)); if(S.er.stack.length>15) S.er.stack.shift();
    const p=pos(e); last=p; draw(p,p);
    const u=document.getElementById('erundo'); if(u) u.disabled=false;
  };
  canvas.onpointermove=(e)=>{ if(!last) return; const p=pos(e); draw(last,p); last=p; };
  canvas.onpointerup=canvas.onpointercancel=()=>{ last=null; };
  S.sheetMode='erase'; renderEraseSheet();
}

/* ---------------- Anziehen ---------------- */
function curSeason(){ const m=new Date().getMonth()+1; return (m===12||m<=2)?WI:(m>=6&&m<=8)?SO:UE; }
function visibleSlots(){ return SLOTS.filter(s=>S.d.kleid ? !['oben','unten','hemden'].includes(s.key) : s.key!=='kleid'); }
// Solange "Hemden" eingeblendet ist, gehört Hemd/Bluse dorthin statt zu Oberteil (sonst wäre es doppelt wählbar).
function effectiveCats(slot){
  if(slot.key==='oben' && !S.d.hidden.has('hemden')) return slot.cats.filter(c=>c!=='Hemd/Bluse');
  return slot.cats;
}
function slotForCategory(cat){
  if(cat==='Hemd/Bluse') return SLOTS.find(s=>s.key===(S.d.hidden.has('hemden')?'oben':'hemden'));
  return SLOTS.find(x=>x.cats.includes(cat));
}
function candidates(slot){
  const season=curSeason();
  const cats=effectiveCats(slot);
  const list=S.items.filter(i=>cats.includes(i.category)
    && (!S.d.seasonOn || !(i.seasons||[]).length || i.seasons.includes(season))
    && (!S.d.style || (i.styles||[]).includes(S.d.style))
    && (S.d.hideLoan || !i.loaned_to));
  if(S.d.locked.has(slot.key)){ const it=S.items.find(i=>i.id===S.d.sel[slot.key]); if(it && !list.includes(it)) list.unshift(it); }
  return list;
}
function currentItem(slot,list){
  let it=list.find(i=>i.id===S.d.sel[slot.key]);
  if(!it && list.length){ it=list[0]; S.d.sel[slot.key]=it.id; }
  return it;
}
/* ---------------- Reisemodus ---------------- */
function poolFor(slot,se=curSeason()){ const cats=effectiveCats(slot); return S.items.filter(i=>cats.includes(i.category)&&(!(i.seasons||[]).length||i.seasons.includes(se))&&(S.d.hideLoan||!i.loaned_to)); }
function planTrip(n,se=curSeason()){
  const use={}, plan=[], seen=new Set();
  const slotOf=(k)=>SLOTS.find(x=>x.key===k);
  const hasKleid=poolFor(slotOf('kleid'),se).length>0;
  for(let d=0;d<n;d++){
    let best=null;
    for(let attempt=0;attempt<8;attempt++){
      const kleid=hasKleid && Math.random()<.25, chosen=[];
      const keys=(kleid?['kleid','jacke','schuhe']:['oben','unten','jacke','schuhe']).filter(k=>k!=='jacke'||se!==SO);
      for(const key of keys){
        const list=poolFor(slotOf(key),se); if(!list.length) continue;
        const bd=list.map(i=>badness(i,chosen)), mn=Math.min(...bd);
        let pool=list.filter((i,k)=>bd[k]===mn);
        const lo=Math.min(...pool.map(i=>use[i.id]||0)); pool=pool.filter(i=>(use[i.id]||0)===lo);
        chosen.push(pool[Math.floor(Math.random()*pool.length)]);
      }
      const sig=chosen.map(i=>i.id).sort().join();
      best=chosen; if(!seen.has(sig)){ seen.add(sig); break; }
    }
    best.forEach(i=>use[i.id]=(use[i.id]||0)+1);
    plan.push(best);
  }
  return plan;
}
async function tripWeather(dest,n){
  const g=await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&name='+encodeURIComponent(dest))).json();
  const p=g.results?.[0]; if(!p) return null;
  // Zeigt immer die nächsten 10 Tage an, unabhängig von der eingestellten Reisedauer.
  const j=await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=10`)).json();
  const mx=j.daily.temperature_2m_max, mn=j.daily.temperature_2m_min, pr=j.daily.precipitation_probability_max, wc=j.daily.weather_code, tm=j.daily.time;
  const packN=Math.min(n,mx.length);
  const avg=(a)=>a.slice(0,packN).reduce((x,y)=>x+y,0)/packN;
  const hi=avg(mx), lo=avg(mn), rain=Math.max(...pr.slice(0,packN).map(x=>x||0));
  const season=hi>=22?SO:hi<=10?WI:UE;
  const days=tm.map((iso,i)=>{
    const code=wc?.[i], prb=pr?.[i]||0;
    const w=SNOW.has(code)?'Schnee':(RAIN.has(code)||prb>=60)?'Regen':'trocken';
    const label=i===0?'Heute':i===1?'Morgen':new Date(iso).toLocaleDateString('de-AT',{weekday:'short'});
    return {label, max:Math.round(mx[i]), min:Math.round(mn[i]), what:w};
  });
  return {name:p.name, season, text:`${p.name}: ${Math.round(lo)}–${Math.round(hi)} °C, ${rain>=60?'Regen wahrscheinlich':rain>=30?'vereinzelt Regen':'meist trocken'}`, days, short:n>mx.length};
}

    catch(e){ t.note='Wetter gerade nicht abrufbar, ich nehme die Jahreszeit von hier.'; }
  }
  t.season=season; t.plan=planTrip(t.days,season); renderTravel();
}

const RAIN=new Set([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99]), SNOW=new Set([71,73,75,77,85,86]);
async function loadWeather(){
  if(S.wxBusy || (S.wx && Date.now()-S.wx.at<30*60000) || !navigator.onLine) return;

const isNeutral = (i) => NEUTRAL.has(i.color) || (i.color==='Blau' && ['Hose','Kurze Hose'].includes(i.category));
const neutralColor = (c,cat) => NEUTRAL.has(c) || (c==='Blau' && ['Hose','Kurze Hose'].includes(cat));
/* ---- Modekonzept: Förmlichkeitsstufen + No-Gos ---- */
const FORMAL=(i)=>{ const st=i.styles||[]; return st.includes('Festlich')||st.includes('Business'); };
function levels(i){
  const st=i.styles||[], c=i.category, L=new Set();
  if(c==='Tasche' && (i.bagSize||i.bag_size)){               // Taschengröße: klein wirkt festlich, groß wirkt leger
    const sz=i.bagSize||i.bag_size;
    if(sz==='Klein') return [3,4];
    if(sz==='Groß') return [1,2];
    return null;
  }
  if(FORMAL(i)) L.add(4);
  if(st.includes('Sport')) L.add(1);
  if(st.includes('Freizeit')) L.add(2);
  if(!L.size) return null;                                  // ohne Stil: keine Prüfung
  if(c==='Sakko'){ L.add(3); [...L].forEach(x=>{ if(x<3) L.delete(x); }); }   // Sakko nie unter 3
  if(c==='Kurze Hose'){ [...L].forEach(x=>{ if(x>2) L.delete(x); }); L.add(2); } // kurze Hose nie über 2
  if((c==='Hemd/Bluse'||c==='Hose') && L.has(4)) L.add(3);  // Hemd/Chino gehen auch smart casual
  return [...L];
}
const winterOnly=(i)=>(i.seasons||[]).length && i.seasons.includes(WI) && !i.seasons.includes(SO);
function pairHits(a,b){
  const h=[], ca=a.category, cb=b.category;
  const is=(x,y)=>(ca===x&&cb===y)||(ca===y&&cb===x);
  const of=(cat)=>ca===cat?a:cb===cat?b:null;
  // Stufen: höchstens eine Stufe Unterschied
  if(ca!=='Accessoires' && cb!=='Accessoires'){
    const la=levels(a), lb=levels(b);
    if(la && lb && !la.some(x=>lb.some(y=>Math.abs(x-y)<=1))) h.push('stufe');
  }
  // Kurze Hose nie mit Sakko, Mantel oder festlichen Lederschuhen
  const kh=of('Kurze Hose');
  if(kh){ const o=kh===a?b:a;
    if(o.category==='Sakko' || (o.category==='Jacke/Mantel' && winterOnly(o)) || (o.category==='Schuhe' && FORMAL(o))) h.push('kurz'); }
  // Hosen-Schnitt und Schuhe: weite Hose verdeckt einen hohen Stiefelschaft (sinnlos kombiniert),
  // Plateauschuhe wirken an einer Skinny-Hose unproportioniert (Quelle: gängige Styling-Regeln zu Silhouette/Proportion)
  const hose=of('Hose');
  if(hose && hose.fit){ const o=hose===a?b:a;
    if(o.category==='Schuhe'){
      if(hose.fit==='Weit' && o.shaft==='Stiefel') h.push('schnitt');
      if(hose.fit==='Skinny' && o.heel==='Plateau') h.push('schnitt');
    }
    // Proportion: nie Hose und Oberteil beide eng ODER beide weit gleichzeitig (Styling-Grundregel)
    if(TOP_CATS.includes(o.category) && o.fit && o.fit===hose.fit && hose.fit!=='Normal') h.push('schnitt');
  }
  // dieselbe Proportionsregel auch für Kleid + Jacke/Mantel
  const kleid=of('Kleid');
  if(kleid && kleid.fit){ const o=kleid===a?b:a;
    if(o.category==='Jacke/Mantel' && o.fit && o.fit===kleid.fit && kleid.fit!=='Normal') h.push('schnitt');
  }
  // Mütze/Haube nie zu Festlich oder Business
  const kp=of('Kopfbedeckung');
  if(kp){ const o=kp===a?b:a; if(!FORMAL(kp) && FORMAL(o)) h.push('kopf'); }
  // Show nur mit Show oder neutralen Basics, nie mit Business
  for(const [x,y] of [[a,b],[b,a]]){
    if((x.styles||[]).includes('Show') && !(y.styles||[]).includes('Show') && (!isNeutral(y) || (y.styles||[]).includes('Business'))) h.push('show');
  }
  // Jahreszeit: gemeinsame Jahreszeit nötig, reine Winter- nie mit reinen Sommerteilen
  const sa=a.seasons||[], sb=b.seasons||[];
  if(sa.length && sb.length && !sa.some(x=>sb.includes(x))) h.push('saison');
  return h;
}
const RELAX_KEY='gk-relax';
function relaxMap(){ try{ return JSON.parse(localStorage.getItem(RELAX_KEY)||'{}'); }catch(e){ return {}; } }
const isRelaxed=(id)=>(relaxMap()[id]||0)>=2;               // Lernfähigkeit: 2× so getragen → Regel gilt für dich nicht mehr
function comboHits(items){
  const h=new Set();
  for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++) pairHits(items[i],items[j]).forEach(x=>h.add(x));
  const colorful=new Set();                              // Haupt- UND Nebenfarbe (z. B. Streifen) zählen für die Farbregel
  items.forEach(x=>{
    if(!neutralColor(x.color,x.category)) colorful.add(x.color);
    if(x.color2 && !neutralColor(x.color2,x.category)) colorful.add(x.color2);
  });
  if(colorful.size>2) h.add('farbe');
  return h;
}
function badness(item,chosen){
  let n=0; for(const c of chosen) n+=pairHits(c,item).filter(id=>!isRelaxed(id)).length;
  if(!comboHits(chosen).has('farbe') && comboHits([...chosen,item]).has('farbe')) n++;
  return n;
}
const fits=(item,chosen)=>badness(item,chosen)===0;
function learnFromWorn(items){
  const h=comboHits(items); h.delete('farbe'); if(!h.size) return;
  const m=relaxMap(); h.forEach(id=>m[id]=(m[id]||0)+1);
  try{ localStorage.setItem(RELAX_KEY,JSON.stringify(m)); }catch(e){}
}

function shortDesc(t){
  const first=String(t||'').replace(/\s+/g,' ').trim().split(/(?<=[.!?…])\s/)[0]||'';
  const w=first.split(' ');
  return w.length>9 ? w.slice(0,8).join(' ').replace(/[,;:]$/,'')+'.' : first;
}
// Vorschlag von Charly gegen die Regeln prüfen und Verstöße durch besser passende Teile ersetzen
function repairSel(sel){
  const order=['kopf','acc','jacke','schuhe','unten','oben'];   // was zuerst getauscht wird
  const get=()=>Object.entries(sel).map(([k,id])=>({k,it:S.items.find(i=>i.id===id)})).filter(x=>x.it);
  for(let round=0;round<8;round++){
    const cur=get(), bad=[...comboHits(cur.map(x=>x.it))].filter(id=>id!=='farbe'&&!isRelaxed(id));
    const badF=comboHits(cur.map(x=>x.it)).has('farbe');
    if(!bad.length && !badF) break;
    let fixed=false;
    for(const key of order){
      const e=cur.find(x=>x.k===key); if(!e) continue;
      const others=cur.filter(x=>x!==e).map(x=>x.it);
      const now=badness(e.it,others); if(!now) continue;
      const slot=SLOTS.find(x=>x.key===key), season=curSeason();
      const alts=S.items.filter(i=>effectiveCats(slot).includes(i.category)&&i.id!==e.it.id&&(!(i.seasons||[]).length||i.seasons.includes(season)));
      let best=null,bb=now;
      for(const a of alts){ const b=badness(a,others); if(b<bb){ bb=b; best=a; } }
      if(best){ sel[key]=best.id; fixed=true; break; }
      if(['kopf','acc','jacke'].includes(key)){ delete sel[key]; fixed=true; break; }
    }
    if(!fixed) break;
  }
  return sel;
}
function shuffle(){
  const slots=visibleSlots().filter(s=>!S.d.hidden.has(s.key));
  const chosen=slots.filter(s=>S.d.locked.has(s.key)).map(s=>S.items.find(i=>i.id===S.d.sel[s.key])).filter(Boolean);
  const recent=recentWornIds(2), counts=wornCount();
  for(const key of ['kleid','oben','unten','jacke','schuhe','kopf','acc']){
    const s=slots.find(x=>x.key===key); if(!s || S.d.locked.has(key)) continue;
    const list=candidates(s); if(!list.length) continue;
    const bd=list.map(i=>badness(i,chosen)), mn=Math.min(...bd); let pool=list.filter((i,k)=>bd[k]===mn);   // immer die bestmögliche Kombination
    const fresh=pool.filter(i=>!recent.has(i.id)); if(fresh.length) pool=fresh;          // Abwechslung: nicht, was du gerade getragen hast
    const w=pool.map(i=>1+Math.min(3,(counts[i.id]||0))*0.5);                               // Geschmack: oft getragene Teile etwas bevorzugen
    let r=Math.random()*w.reduce((a,b)=>a+b,0), pick=pool[0];
    for(let k=0;k<pool.length;k++){ r-=w[k]; if(r<=0){ pick=pool[k]; break; } }
    S.d.sel[key]=pick.id; chosen.push(pick);
  }
  render(); describeCurrent();
}

const SHARE_DAYS=20;
async function makeShare(name, description, parts, outfitId){
  try{
    const {data:signed,error:sErr}=await sb.storage.from(BUCKET).createSignedUrls(parts.map(x=>x.it.image_path), SHARE_DAYS*86400);
    if(sErr) throw sErr;
    const expires=new Date(Date.now()+SHARE_DAYS*86400e3);
    const token=crypto.randomUUID().replace(/-/g,'');
    const data={name, owner:userName(), description:description||'', expires:expires.toISOString(),
      items:parts.map((x,k)=>({slot:x.s.key, category:x.it.category, color:x.it.color, url:signed[k]?.signedUrl}))};
    const {error}=await sb.from('shares').insert({token, outfit_id:outfitId||null, data, expires_at:expires.toISOString()});
    if(error) throw error;
    const link=location.origin+location.pathname+'?s='+token;
    S.sheetMode='sharelink'; S.shareLink={link, name, expires};
    renderShareSheet();
  }catch(e){ console.error(e); toast('Teilen fehlgeschlagen: '+(e.message||e)); }
}
function shareOutfit(id){
  const o=S.outfits.find(x=>x.id===id); if(!o) return;
  const parts=SLOTS.map(s=>({s, it:S.items.find(i=>i.id===o.slots?.[s.key])})).filter(x=>x.it);
  if(!parts.length){ toast('Dieses Outfit hat keine Teile mehr'); return; }
  makeShare(o.name, o.description, parts, o.id);
}

  makeShare(name, desc, parts, null);
}

function currentSlots(){
  const slots={};
  visibleSlots().filter(s=>!S.d.hidden.has(s.key)).forEach(s=>{ const it=currentItem(s,candidates(s)); if(it) slots[s.key]=it.id; });
  return slots;
}
async function updateOutfit(btn){
  const o=S.outfits.find(x=>x.id===S.d.editing); if(!o) return;
  const slots=currentSlots(); if(!Object.keys(slots).length){ toast('Zuerst ein paar Teile auswählen'); return; }
  btn.disabled=true;
  const patch={slots}; if(S.d.desc && !S.d.desc.loading && S.d.desc.text) patch.description=S.d.desc.text;
  const {data,error}=await sb.from('outfits').update(patch).eq('id',o.id).select().single();
  btn.disabled=false;

// Gemeinsame Feld-Aktionen für Hinzufügen (q) und Bearbeiten (e)
for(const pre of ['q','e']){
  A[pre+'-color']=(t)=>{ const o=qById(t.dataset.i); if(o){ o.color=t.dataset.v; o.touched=true; rerender(pre); } };
  A[pre+'-color2']=(t)=>{ const o=qById(t.dataset.i); if(o){ o.color2=t.dataset.v; o.touched=true; rerender(pre); } };
  A[pre+'-bagsize']=(t)=>{ const o=qById(t.dataset.i); if(o){ o.bagSize=o.bagSize===t.dataset.v?'':t.dataset.v; o.touched=true; rerender(pre); } };
  A[pre+'-heel']=(t)=>{ const o=qById(t.dataset.i); if(o){ o.heel=o.heel===t.dataset.v?'':t.dataset.v; o.touched=true; rerender(pre); } };
  A[pre+'-fit']=(t)=>{ const o=qById(t.dataset.i); if(o){ o.fit=o.fit===t.dataset.v?'':t.dataset.v; o.touched=true; rerender(pre); } };
  A[pre+'-style']=(t)=>{ const o=qById(t.dataset.i); if(o){ o.styles=toggleIn(o.styles,t.dataset.v); o.touched=true; rerender(pre); } };
  A[pre+'-season']=(t)=>{ const o=qById(t.dataset.i); if(o){ o.seasons=toggleIn(o.seasons,t.dataset.v); o.touched=true; rerender(pre); } };
}
document.addEventListener('click',(e)=>{
  if(e.target===sheet){ S.sheetMode==='erase' ? S.er.back() : closeSheet(); return; }
  const t=e.target.closest('[data-a]');
  if(t && !t.disabled && A[t.dataset.a]){ e.preventDefault(); A[t.dataset.a](t,e); }
});
document.addEventListener('change',(e)=>{
  const t=e.target, c=t.dataset.c; if(!c) return;
  if(c==='files'){ if(t.files?.length) addFiles([...t.files]); t.value=''; }
  else if(c==='q-cat'||c==='e-cat'){ const o=qById(t.dataset.i); if(o){ o.cat=t.value; o.touched=true; if(c==='e-cat') renderSheet(); } }
  else if(c==='q-mat'||c==='e-mat'){ const o=qById(t.dataset.i); if(o){ o.material=t.value; o.touched=true; } }
  else if(c==='q-shaft'||c==='e-shaft'){ const o=qById(t.dataset.i); if(o){ o.shaft=t.value; o.touched=true; } }
  else if(c==='q-pattern'||c==='e-pattern'){ const o=qById(t.dataset.i); if(o){ o.pattern=t.value; o.touched=true; } }
  else if(c==='q-keep'){ const o=qById(t.dataset.i); if(o){ o.keep=t.checked; render(); } }
  else if(c==='o-folder'){ S.osave.folder=t.value; renderOutfitSheet(); }
  else if(c==='oe-folder'){ S.oedit.folder=t.value; renderOEdit(); }
  else if(c==='restore'){ const f=t.files?.[0]; t.value=''; if(f && confirm('Teile aus dieser Sicherung wiederherstellen? Vorhandene Teile bleiben unverändert.')) restoreBackup(f); }
});
document.addEventListener('input',(e)=>{
  const t=e.target, c=t.dataset.c; if(!c) return;
  if(c==='q-note'||c==='e-note'){ const o=qById(t.dataset.i); if(o){ o.note=t.value; o.touched=true; } }
  else if(c==='schrank-search'){ S.search=t.value; render(); }
  else if(c==='mk-search'){ S.mk.search=t.value; renderMultikasten(); }
  else if(c==='e-loanto'){ const o=qById(t.dataset.i); if(o){ o.loanedTo=t.value; o.touched=true; } }
});
document.addEventListener('keydown',(e)=>{ if(e.key==='Enter' && e.target.id==='sg-text'){ e.preventDefault(); runSuggest(e.target.value); return; } if(e.key==='Escape' && !sheet.hidden){ S.sheetMode==='erase' ? S.er.back() : closeSheet(); } });

/* ---- Hell/Dunkel nach Sonnenauf- und -untergang in Wien ---- */
function sunTimes(d, lat=48.2082, lon=16.3738){
  const rad=Math.PI/180, base=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  const day=Math.round((base-Date.UTC(d.getFullYear(),0,1))/864e5)+1, g=2*Math.PI/365*(day-1);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const decl=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const ha=Math.acos(Math.cos(90.833*rad)/(Math.cos(lat*rad)*Math.cos(decl))-Math.tan(lat*rad)*Math.tan(decl))/rad;
  return {rise:new Date(base+(720-4*(lon+ha)-eq)*6e4), set:new Date(base+(720-4*(lon-ha)-eq)*6e4)};
}
function applyTheme(){
  const now=new Date(), {rise,set}=sunTimes(now), dark=!(now>=rise && now<set);
  document.documentElement.dataset.theme=dark?'dark':'light';
  document.getElementById('themecolor')?.setAttribute('content', dark?'#141414':'#ffffff');
}
document.documentElement.dataset.theme='light';   // immer hell
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e=>console.warn('Service Worker', e));

boot();
